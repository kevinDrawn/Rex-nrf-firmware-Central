CONFIG_NCS_SAMPLES_DEFAULTS=y
CONFIG_ESB=y
CONFIG_DK_LIBRARY=y
CONFIG_CLOCK_CONTROL=y

# ADC + NRFFX + SAADC
CONFIG_NRFX_SAADC=y
CONFIG_NRFX_GPPI=y
CONFIG_NRFX_TIMER1=y

# Main Thread Stack
CONFIG_MAIN_STACK_SIZE=4096

# Device
CONFIG_GPIO=y

# UART 
CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_NRFX_UARTE0=y   # UART0 활성화 (필요 시)
CONFIG_UART_ASYNC_API=y
CONFIG_RING_BUFFER=y

# LOG
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_LOG_MAX_LEVEL=4

CONFIG_LOG_MODE_MINIMAL=n
CONFIG_LOG_MODE_DEFERRED=y

CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y

CONFIG_LOG_BACKEND_UART=n
CONFIG_UART_CONSOLE=n

# =========================
# 2. MPSL + FEM (nRF21540 DK)
# 보드가 21540 달려있는 걸로 돼 있어도
# 이 정도는 명시해두면 안전함
# =========================
CONFIG_MPSL=y
CONFIG_MPSL_FEM=y
CONFIG_MPSL_FEM_NRF21540_GPIO=y

# CAN
CONFIG_SPI=y
CONFIG_CAN=y
CONFIG_CAN_MCP2515=y

# Mode
CONFIG_HALL_MODE=y
CONFIG_CAN_MODE=y
CONFIG_EMG_MODE=y

# Control Mode
CONFIG_CONTRALATERAL_MODE=y
CONFIG_FIXED_MODE=n
